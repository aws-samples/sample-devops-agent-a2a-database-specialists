AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Least-privilege IAM roles for the Oracle A2A adapter. Deploy first with the
  runtime name prefix, then update A2ARuntimeArn to the exact deployed ARN.

Parameters:
  DownstreamOracleRuntimeArn:
    Type: String
    Description: AI-DB-OPS dbops_oracle_readonly AgentCore runtime ARN (DBOPS_READ_ONLY_MODE=true).
    AllowedPattern: '^arn:(aws|aws-us-gov|aws-cn):bedrock-agentcore:[a-z0-9-]+:[0-9]{12}:runtime/dbops_oracle_readonly-[A-Za-z0-9]+$'
  A2ARuntimeNamePrefix:
    Type: String
    Default: oracle_db_troubleshooter_a2a
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]{0,47}$'
    Description: Name prefix used to bootstrap the AgentCore A2A runtime.
  A2ARuntimeArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:(aws|aws-us-gov|aws-cn):bedrock-agentcore:[a-z0-9-]+:[0-9]{12}:runtime/oracle_db_troubleshooter_a2a-[A-Za-z0-9]+$'
    Description: Exact A2A runtime ARN. Supply this in a stack update after deployment.

Conditions:
  HasExactA2ARuntimeArn: !Not [!Equals [!Ref A2ARuntimeArn, '']]

Resources:
  OracleA2ARuntimeRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Invokes only the configured Oracle runtime and writes adapter telemetry.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AgentCoreRuntimeAssumeRole
            Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !If
                  - HasExactA2ARuntimeArn
                  - !Ref A2ARuntimeArn
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/${A2ARuntimeNamePrefix}-*'
  DevOpsAgentA2AInvocationRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Allows AWS DevOps Agent to invoke only the Oracle A2A runtime.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DevOpsAgentAssumeRole
            Effect: Allow
            Principal:
              Service: aidevops.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:aidevops:${AWS::Region}:${AWS::AccountId}:service/*'
  OracleA2ARuntimeInvokePolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: InvokeConfiguredOracleRuntime for OracleA2ARuntimeRole.
      Roles:
        - !Ref OracleA2ARuntimeRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: InvokeOracleRuntime
            Effect: Allow
            Action: bedrock-agentcore:InvokeAgentRuntime
            # InvokeAgentRuntime authorizes against the runtime-endpoint
            # sub-resource when a qualifier is supplied. The adapter pins
            # qualifier=DEFAULT, so both ARN forms are required.
            Resource:
              - !Ref DownstreamOracleRuntimeArn
              - !Sub '${DownstreamOracleRuntimeArn}/runtime-endpoint/DEFAULT'
  OracleA2ARuntimeTelemetryPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: AgentCoreRuntimeTelemetry for OracleA2ARuntimeRole.
      Roles:
        - !Ref OracleA2ARuntimeRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CreateAndDescribeAdapterLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DescribeLogStreams
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/${A2ARuntimeNamePrefix}-*'
          - Sid: DiscoverLogGroups
            Effect: Allow
            Action: logs:DescribeLogGroups
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
          - Sid: WriteAdapterLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/${A2ARuntimeNamePrefix}-*:log-stream:*'
          - Sid: ManageRuntimeLogDeliveryPolicy
            Effect: Allow
            Action: logs:PutResourcePolicy
            # Scoped to this adapter's runtime log groups, as in the
            # AgentCore Runtime execution role guidance.
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/${A2ARuntimeNamePrefix}-*'
          - Sid: WriteRuntimeTraces
            Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
            Resource: '*'
          - Sid: WriteRuntimeMetrics
            Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: '*'
            Condition:
              StringEquals:
                cloudwatch:namespace: bedrock-agentcore
  DevOpsAgentA2AInvocationPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: InvokeOracleA2ARuntime for DevOpsAgentA2AInvocationRole.
      Roles:
        - !Ref DevOpsAgentA2AInvocationRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: InvokeOracleA2AOnly
            Effect: Allow
            Action: bedrock-agentcore:InvokeAgentRuntime
            # Covers the bare runtime ARN and the runtime-endpoint
            # sub-resource that IAM evaluates when a qualifier is sent.
            Resource: !If
              - HasExactA2ARuntimeArn
              - - !Ref A2ARuntimeArn
                - !Sub '${A2ARuntimeArn}/runtime-endpoint/*'
              - - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/${A2ARuntimeNamePrefix}-*'
                - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/${A2ARuntimeNamePrefix}-*/runtime-endpoint/*'
Outputs:
  OracleA2ARuntimeRoleArn:
    Description: Pass this role to AgentCore when configuring the A2A runtime.
    Value: !GetAtt OracleA2ARuntimeRole.Arn
  DevOpsAgentA2AInvocationRoleArn:
    Description: Use this role when registering the SigV4 remote agent.
    Value: !GetAtt DevOpsAgentA2AInvocationRole.Arn
  ExactRuntimeScopeApplied:
    Description: True after the stack is updated with the exact A2A runtime ARN.
    Value: !If [HasExactA2ARuntimeArn, 'true', 'false']
